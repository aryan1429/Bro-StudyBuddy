services:
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - studybuddy-network

  # Frontend - Next.js 14
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: always
    expose:
      - "3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Empty string = uses relative /api URLs (nginx proxy)
      - NEXT_PUBLIC_API_URL=
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - studybuddy-network

  # Backend - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    env_file:
      - ./backend/.env
    depends_on:
      - qdrant
    networks:
      - studybuddy-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Vector Database - Qdrant
  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - studybuddy-network

  # Database - PostgreSQL
  postgres:
    image: postgres:16-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=studybuddy
      - POSTGRES_PASSWORD=studybuddy123
      - POSTGRES_DB=studybuddy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - studybuddy-network

volumes:
  qdrant_data:
  postgres_data:


networks:
  studybuddy-network:
    driver: bridge
